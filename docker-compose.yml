services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: profit
      POSTGRES_PASSWORD: profit_dev_local
      POSTGRES_DB: profit_tracker
    ports:
      - "5432:5432"
    volumes:
      - profit_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profit -d profit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  profit_pg:
